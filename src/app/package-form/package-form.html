<form class="flex flex-row flex-4 max-w-4xl items-center" (submit)="onSubmit()">
  <div class="fgap-4">
    <span>Absenderadresse</span>
    <label class="input">
      <span class="label">Country</span>
      <input type="text" placeholder="AT" [field]="packageForm.fromCountry" />
    </label>
    <label class="input">
      <span class="label">ZIP Code</span>
      <input type="number" placeholder="1234" [field]="packageForm.fromZip" />
    </label>
    <label class="input">
      <span class="label">City</span>
      <input type="text" placeholder="City" [field]="packageForm.fromCity" />
    </label>
    <label class="input">
      <span class="label">Street</span>
      <input type="text" placeholder="Street" [field]="packageForm.fromStreet" />
    </label>
  </div>
  <div class="gap-4 mt-4">
    <span>Empfängeradresse</span>
    <label class="input">
      <span class="label">Country</span>
      <input type="text" placeholder="AT" [field]="packageForm.toCountry" />
    </label>
    <label class="input">
      <span class="label">ZIP Code</span>
      <input type="number" placeholder="1234" [field]="packageForm.toZip" />
    </label>
    <label class="input">
      <span class="label">City</span>
      <input type="text" placeholder="City" [field]="packageForm.toCity" />
    </label>
    <label class="input">
      <span class="label">Street</span>
      <input type="text" placeholder="Street" [field]="packageForm.toStreet" />
    </label>
  </div>
  <div class="gap-4 mt-4">
    <span>Package Details</span>
    <label class="input">
      <span class="label">Weight (kg)</span>
      <input type="number" step="0.01" placeholder="0.0" [field]="packageForm.weight" />
    </label>
    <label class="input">
      <span class="label">Width (cm)</span>
      <input type="number" step="0.01" placeholder="0.0" [field]="packageForm.width" />
    </label>
    <label class="input">
      <span class="label">Height (cm)</span>
      <input type="number" step="0.01" placeholder="0.0" [field]="packageForm.height" />
    </label>
    <label class="input">
      <span class="label">Length (cm)</span>
      <input type="number" step="0.01" placeholder="0.0" [field]="packageForm.length" />
    </label>
  </div>
  <br />
  <!-- Depending on where this button is used this should either be calculate price or create delivery -->
  <button class="btn" type="submit">Absenden</button>
</form>
