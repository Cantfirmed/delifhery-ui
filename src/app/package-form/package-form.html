<form class="container mx-auto p-4 flex flex-col gap-8 items-center" (submit)="onSubmit($event)">
  <div class="flex flex-col lg:flex-row gap-8 w-full">
    <!-- Sender Section -->
    <div class="card flex-1 shadow-sm border">
      <div class="card-body">
        <h2 class="card-title mb-4">Sender</h2>

        <label class="form-control w-full">
          <div class="label">
            <span class="label-text">Name</span>
          </div>
          <input
            type="text"
            placeholder="Sender Name"
            class="input input-bordered w-full"
            [field]="packageForm.sender.name"
          />
        </label>

        <div class="flex flex-col sm:flex-row gap-4">
          <label class="form-control flex-1">
            <div class="label">
              <span class="label-text">Country</span>
            </div>
            <input
              type="text"
              placeholder="AT"
              class="input input-bordered w-full"
              [field]="packageForm.sender.country"
            />
          </label>

          <label class="form-control flex-1">
            <div class="label">
              <span class="label-text">State</span>
            </div>
            <input
              type="text"
              placeholder="State"
              class="input input-bordered w-full"
              [field]="packageForm.sender.state"
            />
          </label>

          <label class="form-control flex-1">
            <div class="label">
              <span class="label-text">ZIP Code</span>
            </div>
            <input
              type="number"
              placeholder="1234"
              class="input input-bordered w-full"
              [field]="packageForm.sender.zipCode"
            />
          </label>

          <label class="form-control flex-1">
            <div class="label">
              <span class="label-text">City</span>
            </div>
            <input
              type="text"
              placeholder="City"
              class="input input-bordered w-full"
              [field]="packageForm.sender.city"
            />
          </label>
        </div>

        <label class="form-control w-full">
          <div class="label">
            <span class="label-text">Street</span>
          </div>
          <input
            type="text"
            placeholder="Street"
            class="input input-bordered w-full"
            [field]="packageForm.sender.street"
          />
        </label>
      </div>
    </div>

    <!-- Recipient Section -->
    <div class="card flex-1 shadow-sm border">
      <div class="card-body">
        <h2 class="card-title mb-4">Recipient</h2>

        <label class="form-control w-full">
          <div class="label">
            <span class="label-text">Name</span>
          </div>
          <input
            type="text"
            placeholder="Recipient Name"
            class="input input-bordered w-full"
            [field]="packageForm.recipient.name"
          />
        </label>

        <div class="flex flex-col sm:flex-row gap-4">
          <label class="form-control flex-1">
            <div class="label">
              <span class="label-text">Country</span>
            </div>
            <input
              type="text"
              placeholder="AT"
              class="input input-bordered w-full"
              [field]="packageForm.recipient.country"
            />
          </label>

          <label class="form-control flex-1">
            <div class="label">
              <span class="label-text">State</span>
            </div>
            <input
              type="text"
              placeholder="State"
              class="input input-bordered w-full"
              [field]="packageForm.recipient.state"
            />
          </label>

          <label class="form-control flex-1">
            <div class="label">
              <span class="label-text">ZIP Code</span>
            </div>
            <input
              type="number"
              placeholder="1234"
              class="input input-bordered w-full"
              [field]="packageForm.recipient.zipCode"
            />
          </label>

          <label class="form-control flex-1">
            <div class="label">
              <span class="label-text">City</span>
            </div>
            <input
              type="text"
              placeholder="City"
              class="input input-bordered w-full"
              [field]="packageForm.recipient.city"
            />
          </label>
        </div>

        <label class="form-control w-full">
          <div class="label">
            <span class="label-text">Street</span>
          </div>
          <input
            type="text"
            placeholder="Street"
            class="input input-bordered w-full"
            [field]="packageForm.recipient.street"
          />
        </label>
      </div>
    </div>
  </div>

  <!-- Package Section -->
  <div class="card w-full shadow-sm border">
    <div class="card-body">
      <h2 class="card-title mb-4">Package Details</h2>
      <div class="flex flex-col sm:flex-row flex-wrap gap-4">
        <label class="form-control flex-1 min-w-40">
          <div class="label">
            <span class="label-text">Weight (kg)</span>
          </div>
          <input
            type="number"
            step="0.01"
            placeholder="0.0"
            class="input input-bordered w-full"
            [field]="packageForm.weight"
          />
        </label>

        <label class="form-control flex-1 min-w-40">
          <div class="label">
            <span class="label-text">Width (cm)</span>
          </div>
          <input
            type="number"
            step="0.01"
            placeholder="0.0"
            class="input input-bordered w-full"
            [field]="packageForm.width"
          />
        </label>

        <label class="form-control flex-1 min-w-40">
          <div class="label">
            <span class="label-text">Height (cm)</span>
          </div>
          <input
            type="number"
            step="0.01"
            placeholder="0.0"
            class="input input-bordered w-full"
            [field]="packageForm.height"
          />
        </label>

        <label class="form-control flex-1 min-w-40">
          <div class="label">
            <span class="label-text">Length (cm)</span>
          </div>
          <input
            type="number"
            step="0.01"
            placeholder="0.0"
            class="input input-bordered w-full"
            [field]="packageForm.length"
          />
        </label>
      </div>
    </div>
  </div>

  <div class="flex justify-end w-full max-w-4xl">
    <button class="btn btn-primary px-10" type="submit">Absenden</button>
  </div>
</form>
