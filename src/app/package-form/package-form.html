<form class="flex flex-row flex-4 max-w-4xl items-center" (submit)="onSubmit($event)">
  <div class="fgap-4">
    <span>Sender</span>
    <label class="input">
      <span class="label">Name</span>
      <input type="text" placeholder="Sender Name" [field]="packageForm.sender.name" />
    </label>
    <label class="input">
      <span class="label">Country</span>
      <input type="text" placeholder="AT" [field]="packageForm.sender.country" />
    </label>
    <label class="input">
      <span class="label">ZIP Code</span>
      <input type="number" placeholder="1234" [field]="packageForm.sender.zip" />
    </label>
    <label class="input">
      <span class="label">City</span>
      <input type="text" placeholder="City" [field]="packageForm.sender.city" />
    </label>
    <label class="input">
      <span class="label">Street</span>
      <input type="text" placeholder="Street" [field]="packageForm.sender.street" />
    </label>
  </div>
  <div class="gap-4 mt-4">
    <span>Recipient</span>
    <label class="input">
      <span class="label">Name</span>
      <input type="text" placeholder="Recipient Name" [field]="packageForm.recipient.name" />
    </label>
    <label class="input">
      <span class="label">Country</span>
      <input type="text" placeholder="AT" [field]="packageForm.recipient.country" />
    </label>
    <label class="input">
      <span class="label">ZIP Code</span>
      <input type="number" placeholder="1234" [field]="packageForm.recipient.zip" />
    </label>
    <label class="input">
      <span class="label">City</span>
      <input type="text" placeholder="City" [field]="packageForm.recipient.city" />
    </label>
    <label class="input">
      <span class="label">Street</span>
      <input type="text" placeholder="Street" [field]="packageForm.recipient.street" />
    </label>
  </div>
  <div class="gap-4 mt-4">
    <span>Package Details</span>
    <label class="input">
      <span class="label">Weight (kg)</span>
      <input type="number" step="0.01" placeholder="0.0" [field]="packageForm.weight" />
    </label>
    <label class="input">
      <span class="label">Width (cm)</span>
      <input type="number" step="0.01" placeholder="0.0" [field]="packageForm.width" />
    </label>
    <label class="input">
      <span class="label">Height (cm)</span>
      <input type="number" step="0.01" placeholder="0.0" [field]="packageForm.height" />
    </label>
    <label class="input">
      <span class="label">Length (cm)</span>
      <input type="number" step="0.01" placeholder="0.0" [field]="packageForm.length" />
    </label>
  </div>
  <br />
  <button class="btn" type="button">Absenden</button>
</form>
