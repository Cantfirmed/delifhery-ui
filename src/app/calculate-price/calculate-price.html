<div class="container mx-auto p-4">
  <h1 class="text-2xl font-bold mb-4">Calculate Price</h1>
  
  <app-package-form (submitPackage)="onCalculate($event)"></app-package-form>

  @if (price() !== null) {
    <div class="mt-6 p-4 bg-base-200 rounded-lg shadow-md">
      <h2 class="text-xl">Calculated Price: <span class="font-bold text-primary">{{ price() | currency:'EUR' }}</span></h2>
    </div>
  }
</div>
