<div class="container mx-auto p-4">
  <h1 class="text-3xl font-bold mb-4 text-center">Contact Information</h1>
  <div class="card">
    <div class="card-body">
      <p class="text text-center">
        Manage your <strong>contact information</strong> here. You can add new contact details or
        view existing ones.
      </p>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
    <div class="card w-full shadow-sm border bg-base-100">
      <div class="card-body">
        <h2 class="card-title mb-4">Your Contact Information</h2>
        <ul class="list bg-base-100 rounded-box w-full">
          @for (ci of allContactInformation(); track ci.value) {
            <li class="list-row flex items-center p-3 border-b border-base-200 last:border-none">
              <div class="flex flex-col">
                <span class="text-xs font-bold uppercase opacity-60">{{ ci.type }}</span>
                <span class="text-lg">{{ ci.value }}</span>
              </div>
            </li>
          } @empty {
            <li class="p-4 text-center opacity-60">No contact information saved yet.</li>
          }
        </ul>
      </div>
    </div>

    <div class="card w-full shadow-sm border bg-base-100">
      <div class="card-body">
        <app-ci-form (submitForm)="createNew($event)" [loading]="loading()"></app-ci-form>
      </div>
    </div>
  </div>
</div>
