<div class="container mx-auto p-4">
  <h1 class="text-2xl font-bold mb-4">Check Delivery Status</h1>

  <app-track-form (submitTracking)="onTrack($event)"></app-track-form>

  @if (delivery() !== null) {
    <div class="mt-6 p-4 bg-base-200 rounded-lg shadow-md">
      <h2 class="text-xl">Delivery: {{ delivery()?.status }}</h2>

      <span>Your package status:</span><br />
      <span class="font-bold text-primary">{{ delivery()?.package?.sender?.name }}</span>
      <span> ➔ </span>
      <span class="font-bold text-primary">{{ delivery()?.package?.recipient?.name }}</span>
    </div>
  }
</div>
