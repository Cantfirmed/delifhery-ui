<form class="container mx-auto p-4 flex flex-col gap-8 items-center" (submit)="onSubmit($event)">
  <div class="card w-full shadow-sm border">
    <div class="flex flex-col card-body lg:flex-row justify-between">
      <label class="input">
        <span class="label">Tracking Number</span>
        <input type="number" placeholder="123456" [field]="trackingForm.trackingId" />
      </label>
      <label class="input">
        <span class="label">ZIP Code</span>
        <input type="number" placeholder="1234" [field]="trackingForm.zipCode" />
      </label>
    </div>
    <br />
  </div>
  <div class="flex justify-end w-full max-w-4xl mt-4">
    <button #trackButton class="btn btn-primary px-10" type="submit" [disabled]="loading()">
      @if (loading()) {
        <span class="loading loading-spinner"></span>
        Tracking...
      } @else {
        Track
      }
    </button>
  </div>
</form>
