<form class="flex flex-col max-w-4xl items-center" (submit)="onSubmit($event)">
  <div class="flex flex-col lg:flex-row gap-4">
    <label class="input">
      <span class="label">Tracking Number</span>
      <input type="number" placeholder="123456" [field]="trackingForm.trackingId" />
    </label>
    <label class="input">
      <span class="label">ZIP Code</span>
      <input type="number" placeholder="1234" [field]="trackingForm.zipCode" />
    </label>
  </div>
  <br />
  <button class="btn" type="submit">Track</button>
</form>
